{% extends 'tracker/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-4">

        <h1 class="fw-bold">
            ⏳ Pomodoro Focus Timer
        </h1>

        <p class="text-muted">
            Stay focused and boost productivity
        </p>

    </div>

    <div class="card shadow-lg border-0 rounded-4 mx-auto p-5 text-center"
         style="max-width:500px;">

        <h2 id="mode-title" class="fw-bold mb-4">

            Focus Time

        </h2>

        <div id="timer"
             class="display-1 fw-bold text-primary mb-4">

            25:00

        </div>

        <div class="d-flex justify-content-center gap-3 mb-4">

            <button class="btn btn-success px-4"
                    onclick="startTimer()">

                ▶ Start

            </button>

            <button class="btn btn-warning px-4"
                    onclick="pauseTimer()">

                ⏸ Pause

            </button>

            <button class="btn btn-danger px-4"
                    onclick="resetTimer()">

                ⟳ Reset

            </button>

        </div>

        <div class="d-flex justify-content-center gap-2 flex-wrap">

            <button class="btn btn-outline-primary"
                    onclick="setMode(25, 'Focus Time')">

                Focus

            </button>

            <button class="btn btn-outline-success"
                    onclick="setMode(5, 'Short Break')">

                Short Break

            </button>

            <button class="btn btn-outline-dark"
                    onclick="setMode(15, 'Long Break')">

                Long Break

            </button>

        </div>

        <div class="mt-4">

            <button class="btn btn-dark"
                    onclick="toggleFullscreen()">

                🖥 Fullscreen Focus

            </button>

        </div>

    </div>

</div>

<audio id="alarm-sound">

    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
            type="audio/ogg">

</audio>

<script>

let timer;
let totalSeconds = 25 * 60;
let currentSeconds = totalSeconds;
let running = false;

function updateDisplay() {

    const minutes = Math.floor(currentSeconds / 60);
    const seconds = currentSeconds % 60;

    document.getElementById('timer').innerText =
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function startTimer() {

    if(running) return;

    running = true;

    timer = setInterval(() => {

        if(currentSeconds > 0){

            currentSeconds--;

            updateDisplay();

        } else {

            clearInterval(timer);

            running = false;

            document.getElementById('alarm-sound').play();

            alert("⏰ Time's up!");

        }

    }, 1000);
}

function pauseTimer() {

    clearInterval(timer);

    running = false;
}

function resetTimer() {

    clearInterval(timer);

    running = false;

    currentSeconds = totalSeconds;

    updateDisplay();
}

function setMode(minutes, title) {

    totalSeconds = minutes * 60;

    currentSeconds = totalSeconds;

    document.getElementById('mode-title').innerText = title;

    resetTimer();
}

function toggleFullscreen() {

    if (!document.fullscreenElement) {

        document.documentElement.requestFullscreen();

    } else {

        if (document.exitFullscreen) {

            document.exitFullscreen();

        }

    }
}

updateDisplay();

</script>

{% endblock %}
