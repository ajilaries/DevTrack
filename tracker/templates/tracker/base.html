<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevTrack</title>

    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f7fb;
            min-height:100vh;
        }

        /* NAVBAR */

        .navbar{
            padding:14px 0;
        }

        .navbar-brand{
            font-size:1.5rem;
            letter-spacing:1px;
        }

        /* ALERTS */

        .message-container{

            position:fixed;

            top:20px;

            right:20px;

            z-index:9999;

            width:320px;

        }

        .auto-hide-message{
            animation:slideIn 0.4s ease;
        }

        @keyframes slideIn{

            from{
                opacity:0;
                transform:translateX(100%);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

        /* DROPDOWN */

        .dropdown-menu{
            border:none;
            border-radius:14px;
            overflow:hidden;
        }

        .dropdown-item:hover{
            background:#f1f3f5;
        }

        /* MAIN CONTAINER */

        .main-container{
            padding-top:30px;
            padding-bottom:40px;
        }

        /* NOTIFICATION BADGE */

        #notification-badge{
            font-size:0.7rem;
        }

        /* CARD DESIGN */

        .custom-card{
            border:none;
            border-radius:18px;
            box-shadow:0 4px 20px rgba(0,0,0,0.06);
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container">

        <!-- LOGO -->

        <a
            href="/"
            class="navbar-brand fw-bold"
        >

            <i class="bi bi-graph-up-arrow"></i>
            DevTrack

        </a>

        <!-- MOBILE TOGGLER -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarContent"
        >

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- NAVBAR CONTENT -->

        <div
            class="collapse navbar-collapse justify-content-end"
            id="navbarContent"
        >

            {% if user.is_authenticated %}

            <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">

                <!-- NOTIFICATIONS -->

                <div class="dropdown">

                    <button
                        class="btn btn-outline-light position-relative"
                        type="button"
                        data-bs-toggle="dropdown"
                    >

                        <i class="bi bi-bell-fill"></i>

                        <span
                            id="notification-badge"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        >

                            0

                        </span>

                    </button>

                    <ul
                        class="dropdown-menu dropdown-menu-end shadow"
                        id="notification-list"
                        style="width:320px;"
                    >

                        <li class="dropdown-item text-center text-muted">

                            Loading notifications...

                        </li>

                    </ul>

                </div>

                <!-- USER -->

                <span class="text-light fw-semibold">

                    Hi, {{ request.user.username }}

                </span>

                <!-- LOGOUT -->

                <a
                    href="{% url 'logout' %}"
                    class="btn btn-danger btn-sm"
                >

                    <i class="bi bi-box-arrow-right"></i>
                    Logout

                </a>

            </div>

            {% endif %}

        </div>

    </div>

</nav>

<!-- AUTO HIDE MESSAGES -->

{% if messages %}

<div class="message-container">

    {% for message in messages %}

    <div class="alert alert-{{ message.tags }} alert-dismissible fade show auto-hide-message shadow-sm">

        {{ message }}

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
        ></button>

    </div>

    {% endfor %}

</div>

{% endif %}

<!-- MAIN CONTENT -->

<div class="container main-container">

    {% block content %}

    {% endblock %}

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPTS -->

<script>

    // AUTO HIDE ALERTS

    setTimeout(function () {

        let alerts = document.querySelectorAll('.auto-hide-message');

        alerts.forEach(function(alert) {

            let bsAlert = new bootstrap.Alert(alert);

            bsAlert.close();

        });

    }, 3000);


    // LOAD NOTIFICATIONS

    function loadNotifications() {

        const badge = document.getElementById('notification-badge');

        const list = document.getElementById('notification-list');

        if (!badge || !list) return;

        fetch('/api/notifications/recent/')

        .then(response => response.json())

        .then(data => {

            list.innerHTML = '';

            let unread = 0;

            if(data.length === 0){

                list.innerHTML = `

                    <li class="dropdown-item text-center text-muted">

                        No notifications

                    </li>

                `;

            } else {

                data.forEach(notification => {

                    if(!notification.is_read){
                        unread++;
                    }

                    list.innerHTML += `

                        <li>

                            <a
                                href="/notifications/read/${notification.id}/"
                                class="dropdown-item py-2"
                            >

                                <div class="fw-semibold">

                                    ${notification.message}

                                </div>

                                <small class="text-muted">

                                    ${notification.created_at || ''}

                                </small>

                            </a>

                        </li>

                    `;

                });

            }

            badge.innerText = unread;

            if(unread === 0){

                badge.style.display = 'none';

            } else {

                badge.style.display = 'inline-block';

            }

        })

        .catch(error => {

            console.log('Notification Error:', error);

        });

    }

    loadNotifications();

    setInterval(loadNotifications, 5000);

</script>

</body>
</html>
