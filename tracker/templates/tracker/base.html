<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevTrack</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body{
            background-color: #f5f7fb;
        }

        .message-container{

            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 9999;

            width: 320px;

        }

        .auto-hide-message{

            animation: slideIn 0.4s ease;

        }

        @keyframes slideIn{

            from{
                opacity:0;
                transform:translateX(100%);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }
        .dropdown-menu{
        border-radius: 12px;
        }

        .dropdown-item:hover{
            background-color:#f1f3f5;
        }

        .navbar-brand{
            letter-spacing:1px;
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

    <div class="container">

        <!-- LOGO -->

        <a href="/" class="navbar-brand fw-bold fs-4">

            <i class="bi bi-graph-up-arrow"></i>
            DevTrack

        </a>

        {% if user.is_authenticated %}

        <div class="d-flex align-items-center gap-3">

            <!-- NOTIFICATION DROPDOWN -->

            <div class="dropdown">

                <button
                    class="btn btn-outline-light position-relative"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                >

                    <i class="bi bi-bell-fill"></i>

                    <span
                        id="notification-badge"
                        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                    >

                        0

                    </span>

                </button>

                <ul
                    class="dropdown-menu dropdown-menu-end shadow"
                    id="notification-list"
                    style="width: 320px;"
                >

                    <li class="dropdown-item text-center text-muted">

                        Loading...

                    </li>

                </ul>

            </div>

            <!-- LOGOUT -->

            <a
                href="{% url 'logout' %}"
                class="btn btn-danger btn-sm"
            >

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </a>

        </div>

        {% endif %}

    </div>

</nav>


    <!-- AUTO HIDE MESSAGE SECTION -->

    {% if messages %}

        <div class="message-container">

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }} alert-dismissible fade show auto-hide-message shadow"
                     role="alert">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- MAIN CONTENT -->

    <div class="container mt-4">

        {% block content %}

        {% endblock %}

    </div>


    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- AUTO HIDE ALERT SCRIPT -->

<script>

    // AUTO HIDE ALERTS

    setTimeout(function () {

        let alerts = document.querySelectorAll('.auto-hide-message');

        alerts.forEach(function(alert) {

            let bsAlert = new bootstrap.Alert(alert);

            bsAlert.close();

        });

    }, 3000);



    // LOAD NOTIFICATIONS

    function loadNotifications() {

        fetch('/api/notifications/recent/')

        .then(response => response.json())

        .then(data => {

            const badge = document.getElementById('notification-badge');

            const list = document.getElementById('notification-list');

            list.innerHTML = '';

            let unread = 0;

            if(data.length === 0){

                list.innerHTML = `
                    <li class="dropdown-item text-center text-muted">
                        No notifications
                    </li>
                `;

            } else {

                data.forEach(notification => {

                    if(!notification.is_read){
                        unread++;
                    }

                    list.innerHTML += `

                        <li>

                            <a
                                href="/notifications/read/${notification.id}/"
                                class="dropdown-item py-2"
                            >

                                <div class="fw-semibold">

                                    ${notification.message}

                                </div>

                            </a>

                        </li>

                    `;
                });

            }

            badge.innerText = unread;

            if(unread === 0){

                badge.style.display = 'none';

            } else {

                badge.style.display = 'inline-block';

            }

        });

    }

    loadNotifications();

    setInterval(loadNotifications, 5000);

</script>

</body>

</html>
