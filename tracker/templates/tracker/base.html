<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevTrack</title>

    
    <!-- BOOTSTRAP -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    
    <!-- ICONS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    
    <style>

        body{

            background:#f5f7fb;

            overflow-x:hidden;

        }

        
        /* SIDEBAR */

        .sidebar{

            width:250px;

            height:100vh;

            position:fixed;

            top:0;

            left:0;

            background:#111827;

            padding-top:20px;

            z-index:1000;

        }

        .sidebar-brand{

            color:white;

            font-size:26px;

            font-weight:bold;

            text-align:center;

            margin-bottom:30px;

        }

        .sidebar a{

            display:flex;

            align-items:center;

            gap:12px;

            color:#d1d5db;

            padding:14px 22px;

            text-decoration:none;

            transition:0.3s;

            font-weight:500;

        }

        .sidebar a:hover{

            background:#1f2937;

            color:white;

        }

        .sidebar a.active{

            background:#2563eb;

            color:white;

        }

        
        /* MAIN CONTENT */

        .main-content{

            margin-left:250px;

            padding:30px;

        }

        
        /* TOPBAR */

        .topbar{

            background:white;

            padding:15px 25px;

            border-radius:15px;

            margin-bottom:25px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            box-shadow:0 4px 20px rgba(0,0,0,0.05);

        }

        
        /* PROFILE IMAGE */

        .profile-image{

            width:45px;

            height:45px;

            border-radius:50%;

            object-fit:cover;

        }

        
        /* DARK MODE */

        .dark-mode{

            background:#0f172a !important;

            color:white;

        }

        .dark-mode .topbar,

        .dark-mode .card{

            background:#1e293b;

            color:white;

        }

        
        /* MOBILE */

        @media(max-width:768px){

            .sidebar{

                width:100%;

                height:auto;

                position:relative;

            }

            .main-content{

                margin-left:0;

            }

        }

    </style>

</head>

<body id="main-body">


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="sidebar-brand">

        DevTrack

    </div>

    
    <a href="{% url 'dashboard' %}" class="active">

        <i class="bi bi-grid-fill"></i>

        Dashboard

    </a>

    
    <a href="{% url 'add_log' %}">

        <i class="bi bi-plus-circle-fill"></i>

        Add Log

    </a>

    
    <a href="{% url 'notifications' %}">

        <i class="bi bi-bell-fill"></i>

        Notifications

    </a>

    
    <a href="{% url 'profile' %}">

        <i class="bi bi-person-circle"></i>

        Profile

    </a>

    
    <a href="/admin/">

        <i class="bi bi-shield-lock-fill"></i>

        Admin

    </a>

    
    <a href="{% url 'logout' %}">

        <i class="bi bi-box-arrow-right"></i>

        Logout

    </a>

</div>


<!-- MAIN CONTENT -->

<div class="main-content">


    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h5 class="fw-bold mb-0">

                Welcome, {{ request.user.username }}

            </h5>

        </div>

        
        <div class="d-flex align-items-center gap-3">

            <!-- DARK MODE BUTTON -->

            <button
                class="btn btn-dark"
                id="theme-toggle"
            >

                <i class="bi bi-moon-fill"></i>

            </button>

            
            <!-- PROFILE IMAGE -->

            {% if request.user.profile.profile_picture %}

                <img
                    src="{{ request.user.profile.profile_picture.url }}"
                    class="profile-image"
                >

            {% else %}

                <img
                    src="https://ui-avatars.com/api/?name={{ request.user.username }}"
                    class="profile-image"
                >

            {% endif %}

        </div>

    </div>


    <!-- MESSAGES -->

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>

            </div>

        {% endfor %}

    {% endif %}


    <!-- PAGE CONTENT -->

    {% block content %}

    {% endblock %}

</div>


<!-- JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- DARK MODE -->

<script>

    const toggleBtn=document.getElementById('theme-toggle');

    const body=document.getElementById('main-body');

    if(localStorage.getItem('theme')==='dark'){

        body.classList.add('dark-mode');

    }

    toggleBtn.addEventListener('click',()=>{

        body.classList.toggle('dark-mode');

        if(body.classList.contains('dark-mode')){

            localStorage.setItem('theme','dark');

        }else{

            localStorage.setItem('theme','light');

        }

    });

</script>

</body>

</html>
