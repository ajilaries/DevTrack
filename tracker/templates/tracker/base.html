<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DevTrack</title>

    <!-- Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body{
            background-color: #f5f7fb;
        }

        .message-container{

            position: fixed;

            top: 20px;

            right: 20px;

            z-index: 9999;

            width: 320px;

        }

        .auto-hide-message{

            animation: slideIn 0.4s ease;

        }

        @keyframes slideIn{

            from{
                opacity:0;
                transform:translateX(100%);
            }

            to{
                opacity:1;
                transform:translateX(0);
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark shadow">

    <div class="container">

        <!-- LEFT SIDE TITLE -->
        <a href="/" class="navbar-brand fw-bold">

            DevTrack

        </a>

        <!-- RIGHT SIDE LOGOUT -->
        {% if user.is_authenticated %}

            <a
                href="{% url 'logout' %}"
                class="btn btn-danger btn-sm"
            >

                Logout

            </a>

        {% endif %}

    </div>

</nav>


    <!-- AUTO HIDE MESSAGE SECTION -->

    {% if messages %}

        <div class="message-container">

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }} alert-dismissible fade show auto-hide-message shadow"
                     role="alert">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        </div>

    {% endif %}


    <!-- MAIN CONTENT -->

    <div class="container mt-4">

        {% block content %}

        {% endblock %}

    </div>


    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <!-- AUTO HIDE ALERT SCRIPT -->

    <script>

        setTimeout(function () {

            let alerts = document.querySelectorAll('.auto-hide-message');

            alerts.forEach(function(alert) {

                let bsAlert = new bootstrap.Alert(alert);

                bsAlert.close();

            });

        }, 3000);

    </script>

</body>

</html>
