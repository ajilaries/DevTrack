<!DOCTYPE html>
<html>
<head>
    <title>AI Task Helper</title>
    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        ul {
            margin-top: 20px;
        }

        li {
            padding: 8px 0;
        }
    </style>
</head>
<body>

    <h2>🧠 AI Task Helper</h2>

    <form method="POST">
        {% csrf_token %}
        <input
            type="text"
            name="task"
            placeholder="Enter your task"
            required
        >
        <button type="submit">Generate</button>
    </form>

    {% if subtasks %}
        <h3>Suggested Subtasks</h3>
        <ul>
            {% for item in subtasks %}
                <li>✔ {{ item }}</li>
            {% endfor %}
        </ul>
    {% endif %}

</body>
</html>
