{% extends 'tracker/base.html' %}

{% block content %}

<h2>📝 Create Account</h2>

<form method="POST" class="mt-4">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Sign Up</button>
</form>

<p class="mt-3">
    Already have an account?
    <a href="/login/">Login</a>
</p>

{% endblock %}
