{% extends 'tracker/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>

        Study Logs

    </h2>

    
    <a
        href="{% url 'add_log' %}"
        class="btn btn-primary"
    >

        + Add Log

    </a>

</div>


<table class="table table-dark table-striped shadow">

    <thead>

        <tr>

            <th>Date</th>

            <th>Hours</th>

            <th>Topic</th>

            <th>Actions</th>

        </tr>

    </thead>

    
    <tbody>

        {% for log in logs %}

        <tr>

            <td>{{ log.date }}</td>

            <td>{{ log.hours }}</td>

            <td>{{ log.topic }}</td>

            <td>

                <a
                    href="{% url 'edit_log' log.id %}"
                    class="btn btn-warning btn-sm"
                >

                    Edit

                </a>

                
                <a
                    href="{% url 'delete_log' log.id %}"
                    class="btn btn-danger btn-sm"
                >

                    Delete

                </a>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="4" class="text-center">

                No study logs found.

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
