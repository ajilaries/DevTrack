{% extends 'tracker/base.html' %}

{% block content %}

<div class="container mt-5">

    <h1 class="mb-4">
         Dashboard
    </h1>

    <div class="card bg-dark text-light p-4">

        <h3>
            Total Study Hours:
            {{ total_hours }}
        </h3>

    </div>

    <div class="mt-4">

        <h3>Your Logs</h3>

        <table class="table table-dark table-striped mt-3">

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Hours</th>
                    <th>Topic</th>
                </tr>
            </thead>

            <tbody>

                {% for log in logs %}

                <tr>
                    <td>{{ log.date }}</td>
                    <td>{{ log.hours }}</td>
                    <td>{{ log.topic }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
