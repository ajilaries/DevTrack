{% extends 'tracker/base.html' %}

{% block content %}

<h2> Study Logs</h2>

<table class="table table-dark table-striped mt-3">
    <thead>
        <tr>
            <th>Date</th>
            <th>Hours</th>
            <th>Topic</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for log in logs %}
        <tr>
            <td>{{ log.date }}</td>
            <td>{{ log.hours }}</td>
            <td>{{ log.topic }}</td>
            <td>
            <td>
    <a href="/edit/{{ log.id }}/" class="btn btn-warning btn-sm">Edit</a>
     <a href="/delete/{{ log.id }}/" class="btn btn-danger btn-sm">Delete</a>

            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
